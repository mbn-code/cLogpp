name: Bug report
description: Report a problem so we can fix it
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a minimal code sample, the compile/run command, and what you observed.
      placeholder: |
        1. Code sample
        2. Compile/run command
        3. Observed vs. expected
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler and version, C++ standard, and cLog++ version/commit.
      placeholder: "Ubuntu 22.04, g++ 12, -std=c++17, cLog++ @ <commit>"
    validations:
      required: false
